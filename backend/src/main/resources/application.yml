spring:
  application:
    name: smart-finance-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_finance_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /backend

jwt:
  secret: ${JWT_SECRET:DayLaKhoaBaoMatMacDinhChiDungChoMoiTruongLocalDeTest123456789}
  expiration: 86400000

app:
  mail:
    from-name: Smart Finance Hub
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  2fa:
    otp-length: 6
    otp-expiry-seconds: 60
