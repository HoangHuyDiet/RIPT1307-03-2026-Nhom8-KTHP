title: "Phân bổ tài sản"
description: "Quy tắc đa dạng hóa để giảm thiểu rủi ro."
content: |
  Khái niệm: Phân bổ tài sản là cách các nhà đầu tư chia danh mục đầu tư của họ giữa các loại tài sản khác nhau, có thể bao gồm cổ phiếu, tài sản thu nhập cố định và tiền mặt cùng các khoản tương đương tiền mặt. Thông thường, các nhà đầu tư hướng đến việc cân bằng rủi ro và lợi nhuận dựa trên mục tiêu tài chính, khả năng chấp nhận rủi ro và thời gian đầu tư.
  
  3 Nhóm Tài Sản Cốt Lõi:
    - Cổ phiếu (Stocks): Mang lại tiềm năng tăng trưởng vốn cao nhất nhưng cũng đi kèm với biến động và rủi ro lớn nhất.
    - Trái phiếu (Bonds): Cung cấp thu nhập ổn định và có mức độ rủi ro thấp hơn cổ phiếu, giúp tạo lớp đệm an toàn cho danh mục.
    - Tiền mặt và các khoản tương đương tiền (Cash equivalents): Cung cấp tính thanh khoản cao nhất, bảo toàn vốn và đóng vai trò là "quỹ dự phòng" linh hoạt.
  
  Yếu Tố Quyết Định Tỷ Trọng Phân Bổ:
    - Mục tiêu tài chính: Bạn đầu tư để nghỉ hưu, mua nhà hay tích sản? Mục tiêu dài hạn thường cho phép chấp nhận mức rủi ro cao hơn.
    - Khả năng chịu đựng rủi ro (Risk Tolerance): Mức độ thoải mái của bạn khi danh mục bị sụt giảm giá trị trong ngắn hạn.
    - Thời hạn đầu tư (Time Horizon): Khoảng thời gian bạn dự định không cần rút vốn. Thời gian càng dài, bạn càng có thể phân bổ nhiều hơn vào các tài sản tăng trưởng.
  
  Các Chiến Lược Phân Bổ Phổ Biến:
    - Chiến lược 60/40: Một mô hình cổ điển nơi 60% danh mục dành cho cổ phiếu và 40% dành cho trái phiếu, cân bằng giữa tăng trưởng và an toàn.
    - Phân bổ theo độ tuổi: Quy tắc phổ biến là lấy 100 (hoặc 110) trừ đi số tuổi của bạn để ra tỷ lệ phần trăm phân bổ vào cổ phiếu, phần còn lại dành cho trái phiếu và tiền mặt.
    - Đa dạng hóa bổ sung: Bên cạnh 3 nhóm chính, các chuyên gia có thể khuyến nghị phân bổ vào các tài sản khác như vàng (20%) hoặc bất động sản để chống lạm phát.
  
  Tái Cân Bằng Danh Mục (Rebalancing): Thị trường biến động sẽ làm thay đổi tỷ trọng các tài sản ban đầu. Việc tái cân bằng định kỳ giúp đưa danh mục trở về đúng tỷ lệ rủi ro mục tiêu đã đề ra từ trước.