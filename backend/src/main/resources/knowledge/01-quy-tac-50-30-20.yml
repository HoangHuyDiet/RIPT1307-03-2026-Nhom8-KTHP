title: "Quy tắc phân bổ thu nhập 50/30/20"
description: "Hướng dẫn cơ bản để cân đối tài chính cá nhân."
content: |
  Khái niệm: Nguyên tắc 50/30/20 quy định cách phân bổ thu nhập sau thuế thành ba hạng mục chi tiêu: 50% dành cho nhu cầu thiết yếu, 30% cho những thứ bạn muốn chi tiêu và 20% dành cho tiết kiệm . Thượng nghị sĩ Hoa Kỳ Elizabeth Warren đã phổ biến nguyên tắc ngân sách 50/30/20 trong cuốn sách "All Your Worth: The Ultimate Lifetime Money Plan" của bà. Phương pháp này cũng được LearnVest sử dụng.
    - 50%: Nhu cầu thiết yếu là những hóa đơn bạn bắt buộc phải thanh toán và những khoản chi tiêu cần thiết cho sự sống còn. Trong kế hoạch ngân sách này, một nửa thu nhập sau thuế của bạn được phân bổ để trang trải những nhu cầu và nghĩa vụ đó.
      + Các nhu cầu bao gồm: Tiền thuê nhà hoặc tiền trả góp nhà, trả góp xe, hàng tạp hóa, bảo hiểm và chăm sóc sức khỏe, khoản thanh toán nợ tối thiểu, tiện ích.
      + Mẹo: Nếu bạn chi hơn 50% thu nhập cho những nhu cầu thiết yếu, hãy cân nhắc cắt giảm những thứ không cần thiết hoặc đơn giản hóa lối sống của mình. Điều này có thể có nghĩa là chuyển đến một ngôi nhà nhỏ hơn hoặc một chiếc xe khiêm tốn hơn. Một số người tiết kiệm tiền bằng cách đi chung xe đến nơi làm việc hoặc nấu ăn ở nhà thường xuyên hơn.
    - 30%: Mong muốn - Danh mục này cũng bao gồm những quyết định nâng cấp mà bạn đưa ra, chẳng hạn như chọn một miếng bít tết đắt tiền hơn thay vì một chiếc bánh hamburger rẻ hơn hoặc mua một chiếc Mercedes thay vì một chiếc Honda tiết kiệm hơn. Mong muốn là tất cả những thứ bổ sung mà bạn chi tiền để làm cho cuộc sống trở nên thú vị và hấp dẫn hơn. Ví dụ về những thứ bạn muốn bao gồm:
      + Quần áo hoặc phụ kiện không cần thiết như túi xách, đồng hồ hoặc trang sức đắt tiền.
      + Vé tham dự sự kiện.
      + Kỳ nghỉ hoặc các chuyến đi không thiết yếu khác.
      + Thiết bị điện tử mới nhất, đặc biệt là phiên bản nâng cấp của mẫu máy bạn đang sử dụng vẫn hoạt động tốt.
      + Internet tốc độ cực cao, vượt xa nhu cầu xem trực tuyến của bạn.
    - 20%: Tiết kiệm - Hãy cố gắng dành 20% thu nhập ròng của bạn cho tiết kiệm và đầu tư. Nếu có thể, hãy để dành từ ba đến sáu tháng chi phí sinh hoạt để phòng trường hợp mất việc hoặc các trường hợp khẩn cấp khác.Cơ sở quản lý tài chính chuyên ngành. Hãy tập trung vào việc nghỉ hưu và đạt được các mục tiêu tài chính dài hạn hơn sau đó. Một số ví dụ về tiết kiệm bao gồm:
      + Gửi tiền vào tài khoản tiết kiệm lãi suất cao.
      + Lập quỹ dự phòng khẩn cấp.
      + Hãy giữ một phần tiền trong các tài khoản có tính thanh khoản cao nhưng sinh lời tốt.
      + Đầu tư vào cổ phiếu , quỹ chỉ số hoặc các tài sản khác.
      + Đóng góp vào tài khoản IRA cho tài khoản quỹ tương hỗ.
      + Dành dụm tiền để mua bất động sản để nắm giữ lâu dài.
      + Trả nợ vượt quá số tiền thanh toán tối thiểu.
      + Quan trọng: Khoản thu nhập bổ sung đầu tiên nên được dùng để bổ sung vào quỹ dự phòng khẩn cấp nếu bất kỳ khoản tiền nào trong số này cần được sử dụng.
  Tầm quan trọng: 
    - Quy tắc 50/30/20 nhằm giúp các cá nhân quản lý thu nhập sau thuế, chủ yếu là để có sẵn tiền dự phòng cho các trường hợp khẩn cấp và tiết kiệm cho hưu trí. Mỗi hộ gia đình nên ưu tiên tạo và duy trì quỹ dự phòng khẩn cấp trong trường hợp mất việc, chi phí y tế bất ngờ hoặc bất kỳ chi phí tài chính không lường trước nào khác.
    - Tiết kiệm cho hưu trí cũng là một bước quan trọng vì tuổi thọ con người ngày càng tăng. Tính toán xem bạn cần bao nhiêu tiền cho hưu trí từ khi còn trẻ và sau đó nỗ lực hướng tới mục tiêu đó có thể giúp đảm bảo một cuộc sống hưu trí thoải mái.
  Lợi ích:
    - Dễ sử dụng : Quy tắc 50/30/20 cung cấp một khuôn khổ đơn giản để lập ngân sách . Nó dễ hiểu và dễ áp ​​dụng. Bạn có thể phân bổ thu nhập của mình mà không cần những phép tính phức tạp. Ngay cả người ít am hiểu về tài chính nhất cũng có thể tuân thủ các quy tắc này.
    - Quản lý tiền bạc tốt hơn : Bạn có thể đảm bảo rằng các chi phí cần thiết được trang trải, bạn có tiền cho chi tiêu tùy ý và bạn đang tích cực tiết kiệm cho tương lai. Bằng cách này, bạn có thể tiết kiệm cho cả nhu cầu hiện tại và tương lai mà vẫn có thể tận hưởng cuộc sống với tiền bạc của mình.
    - Ưu tiên các khoản chi tiêu thiết yếu : Bạn có thể đáp ứng các nhu cầu cơ bản mà không vượt quá ngân sách hoặc gánh quá nhiều nợ bằng cách ưu tiên những khoản chi tiêu thiết yếu này. Nguyên tắc này quy định rằng một nửa ngân sách của bạn dành cho các nhu cầu thiết yếu, vì vậy kế hoạch này giúp đảm bảo các nhu cầu thiết yếu của bạn được đáp ứng.
    - Nhấn mạnh mục tiêu tiết kiệm : Bạn có thể lập quỹ dự phòng khẩn cấp, chuẩn bị cho nghỉ hưu, trả nợ , đầu tư hoặc theo đuổi các mục tiêu tài chính khác bằng cách dành 20% thu nhập cho tiết kiệm. Bạn sẽ thiết lập được những thói quen tài chính lành mạnh và xây dựng mạng lưới an toàn cho các chi phí bất ngờ hoặc các mục tiêu trong tương lai bằng cách tiết kiệm đều đặn số tiền này.
    - An ninh tài chính lâu dài : Bạn có thể ưu tiên tương lai tài chính của mình bằng cách liên tục dành ra 20% tiền lương. Khoản chi cho tiết kiệm này có thể giúp bạn gia tăng tài sản, đạt được các mục tiêu tài chính dài hạn và mang lại cho bạn và gia đình cảm giác an toàn cả trong ngắn hạn và dài hạn.
    - Mẹo: Ý tưởng đằng sau quy tắc 50/30/20 là bất cứ ai cũng có thể sử dụng tỷ lệ này bất kể thu nhập của họ là bao nhiêu. Tuy nhiên, bạn có thể phải điều chỉnh tỷ lệ phần trăm nếu thu nhập của bạn thấp hoặc bạn sống ở khu vực có chi phí sinh hoạt cao.
  Cách áp dụng:
    - Theo dõi chi phí của bạn: Hãy theo dõi chi tiêu của bạn trong một hoặc hai tháng để hiểu rõ hơn về thói quen chi tiêu. Phân tích chi tiêu của bạn để xác định xem nó đã tuân thủ nguyên tắc 50/30/20 tốt hay không bằng cách phân loại các khoản chi tiêu thành nhu cầu thiết yếu, mong muốn và tiết kiệm. Cách duy nhất để biết bạn có thành công trong việc tuân thủ ngân sách này hay không là theo dõi chi tiêu thực tế của mình. Việc này có thể được thực hiện khá dễ dàng bằng cách sử dụng các chương trình bảng tính như Google Sheets hoặc Microsoft Excel hay sử dụng Smart Finance của chúng tôi.
    - Hiểu rõ thu nhập của bạn: Nguyên tắc ngân sách 50/30/20 dựa trên việc nắm vững thu nhập của bạn. Hãy nhớ rằng thu nhập gộp của bạn có thể rất khác so với thu nhập ròng. Thu nhập gộp là số tiền trước khi khấu trừ thuế thu nhập liên bang và tiểu bang, trong khi thu nhập ròng là số tiền bạn nhận được sau khi trừ thuế – số tiền bạn có thể mang về nhà và chi tiêu. Hiểu rõ thu nhập và số tiền bạn nhận được mỗi kỳ lương sẽ giúp bạn lập ngân sách chính xác hơn cho ba hạng mục chi tiêu.
    - Xác định các chi phí quan trọng của bạn: Các chi phí thiết yếu bao gồm các khoản phí như tiền thuê nhà hoặc trả góp nhà, tiền điện nước, thực phẩm, đi lại, phí bảo hiểm và trả nợ. Những chi phí này cần thiết cho cuộc sống hàng ngày của bạn. Chúng có thể chiếm phần lớn ngân sách của bạn, vì vậy điều quan trọng là phải hết sức cẩn trọng với nhóm chi phí này. Chúng có thể thương lượng được ở một mức độ nào đó, nhưng nhìn chung chúng không linh hoạt và có xu hướng tương tự nhau từ tháng này sang tháng khác.
    - Tự động hóa việc tiết kiệm của bạn: Việc tiết kiệm sẽ trở nên đơn giản hơn nếu bạn tự động hóa quy trình. Hãy thiết lập thanh toán tự động hàng tháng từ tài khoản thanh toán của bạn sang tài khoản đầu tư hoặc tiết kiệm . Điều này đảm bảo rằng tiền của bạn sẽ tăng lên đều đặn mà không cần bạn phải suy nghĩ hay nỗ lực gì. Bạn có thể thấy dễ dàng hơn khi thường xuyên xem xét ngân sách của mình để đảm bảo nó phù hợp với lối sống và mục tiêu tài chính của bạn nếu khoản tiết kiệm được phân bổ tự động.
    - Duy trì tính nhất quán: Áp dụng thành công ngân sách 50/30/20 đòi hỏi sự nhất quán. Hãy tuân thủ chiến lược chi tiêu của bạn và chống lại sự cám dỗ chi tiêu vượt quá ngân sách hoặc đi chệch khỏi tỷ lệ phân bổ đã đặt ra. Kế hoạch chi tiêu này sẽ thành công hơn nếu bạn có những hướng dẫn rõ ràng có thể tuân theo mỗi tháng. Hãy nhớ đặt lại giới hạn chi tiêu mỗi tháng và đừng lấy tiền từ tháng trước.
  Các câu hỏi thường gặp: 
    - Tôi có thể điều chỉnh tỷ lệ phần trăm trong quy tắc 50/30/20 cho phù hợp với hoàn cảnh của mình không?
      + Trả lời: Vâng, bạn có thể điều chỉnh tỷ lệ phần trăm trong quy tắc 50/30/20 dựa trên hoàn cảnh và ưu tiên của mình. Việc điều chỉnh tỷ lệ phần trăm có thể giúp bạn điều chỉnh quy tắc sao cho phù hợp hơn với mục tiêu và nhu cầu tài chính của mình. Điều này đặc biệt quan trọng đối với những người sống ở những khu vực có chi phí sinh hoạt cao hoặc những người có mục tiêu tiết kiệm hưu trí dài hạn cao hơn.
    - Tôi có nên tính thuế vào công thức tính theo quy tắc 50/30/20 không?
      + Trả lời: Không, quy tắc 50/30/20 sử dụng thu nhập sau thuế, hay thu nhập ròng của bạn . Quy tắc này nói rằng bạn nên phân bổ 50% thu nhập sau thuế cho các nhu cầu thiết yếu, 30% cho những thứ bạn muốn chi tiêu và 20% cho tiết kiệm.
    - Làm thế nào để lập ngân sách hiệu quả bằng cách áp dụng quy tắc 50/30/20?
      + Trả lời: Bạn có thể lập ngân sách hiệu quả hơn bằng cách theo dõi chi tiêu, ưu tiên các nhu cầu thiết yếu, chú ý đến những thứ không cần thiết và phân bổ tiền tiết kiệm hoặc trả nợ một cách nhất quán. Hãy cân nhắc sử dụng ứng dụng quản lý ngân sách như Smart Finance của chúng tôi để cuộc sống dễ dàng hơn.
    - Tôi có thể áp dụng quy tắc 50/30/20 để tiết kiệm cho các mục tiêu dài hạn không?
      + Trả lời: Câu trả lời là có, quy tắc 50/30/20 có thể được sử dụng để tiết kiệm cho các mục tiêu dài hạn. Hãy trích một phần trong khoản tiết kiệm 20% (hoặc khoản chi cho những thứ bạn muốn) dành riêng cho các mục tiêu dài hạn của bạn . Những mục tiêu này có thể bao gồm tiền đặt cọc mua nhà, quỹ học phí hoặc đầu tư .
    