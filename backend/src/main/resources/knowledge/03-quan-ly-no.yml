title: "Quản lý nợ xấu và thẻ tín dụng"
description: "Cảnh báo về rủi ro của thẻ tín dụng và nợ xấu."
content: |
  Nợ thẻ tín dụng được coi là "nợ xấu" nếu bạn không thanh toán toàn bộ dư nợ đúng hạn, vì lãi suất thường rất cao (lên tới 30-40%/năm).
  Nợ thẻ tín dụng là một loại nợ không có bảo đảm phát sinh từ các khoản vay thẻ tín dụng xoay vòng. Người vay có thể tích lũy nợ thẻ tín dụng bằng cách mở nhiều tài khoản thẻ tín dụng với các điều khoản và hạn mức tín dụng khác nhau. Tất cả các tài khoản thẻ tín dụng của người vay sẽ được các cơ quan tín dụng báo cáo và theo dõi. Phần lớn các khoản nợ chưa thanh toán trên báo cáo tín dụng của người vay thường là nợ thẻ tín dụng, vì các tài khoản này là tài khoản xoay vòng và vẫn mở vô thời hạn.
  Cách quản lý nợ xấu - nợ thẻ tín dụng:
    - Thanh toán đúng hạn: Luôn thanh toán 100% dư nợ thẻ tín dụng trước ngày đến hạn. Không bao giờ chỉ thanh toán "Mức tối thiểu" (Minimum payment) vì tiền lãi sẽ cộng dồn rất nhanh.
    - Hạn chế sử dụng: Chỉ dùng thẻ tín dụng khi bạn có sẵn tiền mặt để trả. Không dùng thẻ tín dụng để rút tiền mặt vì phí và lãi suất tính ngay lập tức.
    - Trả nợ lãi suất cao trước: Theo phương pháp "Quả cầu tuyết" (Snowball) hoặc "Trận bão tuyết" (Avalanche), hãy ưu tiên trả dứt điểm các khoản nợ có lãi suất cao nhất trước.
