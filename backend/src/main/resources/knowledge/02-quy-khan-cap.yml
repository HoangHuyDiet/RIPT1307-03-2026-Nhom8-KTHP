title: "Quỹ dự phòng khẩn cấp"
description: "Tại sao cần quỹ khẩn cấp và cách xây dựng."
content: |
  Quỹ khẩn cấp là một khoản tiền tiết kiệm chỉ được sử dụng cho những sự cố bất ngờ như mất việc, bệnh hiểm nghèo, hoặc sửa chữa lớn.
  - Quy mô hợp lý: Nên bằng 3 đến 6 tháng chi phí sinh hoạt thiết yếu (chi phí ăn uống, tiền nhà, v.v.).
  - Cách xây dựng: Nên trích tự động 10-20% thu nhập hàng tháng ngay khi nhận lương chuyển vào tài khoản riêng.
  - Tính thanh khoản: Quỹ này nên được gửi ở các hình thức có thể rút ngay (tiền gửi tiết kiệm kỳ hạn ngắn hoặc tài khoản không kỳ hạn), không nên mang đi đầu tư mạo hiểm vì cần dùng ngay khi có biến cố.
