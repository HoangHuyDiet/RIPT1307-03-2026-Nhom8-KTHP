<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fund invitation</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <h2 th:text="'You are invited to ' + ${fundName}">You are invited to a fund</h2>
    <p>Hello <span th:text="${userName}">User</span>,</p>
    <p><strong th:text="${invitedByName}">A member</strong> invited you to join the shared fund.</p>
    <p>This invitation expires in <strong th:text="${expiryDays}">7</strong> days.</p>
    <p>
        <a th:href="${actionUrl}" style="background:#2563eb;color:#ffffff;padding:10px 16px;text-decoration:none;border-radius:4px;display:inline-block;">
            Review invitation
        </a>
    </p>
    <p>Regards,<br><span th:text="${appName}">Smart Finance Hub</span></p>
</body>
</html>
