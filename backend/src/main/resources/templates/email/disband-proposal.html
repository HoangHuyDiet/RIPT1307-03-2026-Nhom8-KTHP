<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Disband proposal</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <h2 th:text="'Disband proposal for ' + ${fundName}">Disband proposal</h2>
    <p>Hello <span th:text="${userName}">User</span>,</p>
    <p><strong th:text="${proposedByName}">Owner</strong> proposed to disband this shared fund.</p>
    <p th:if="${reason != null and !#strings.isEmpty(reason)}"><strong>Reason:</strong> <span th:text="${reason}">Reason</span></p>
    <p>
        <a th:href="${actionUrl}" style="background:#7c3aed;color:#ffffff;padding:10px 16px;text-decoration:none;border-radius:4px;display:inline-block;">
            Respond to proposal
        </a>
    </p>
    <p>Regards,<br><span th:text="${appName}">Smart Finance Hub</span></p>
</body>
</html>
